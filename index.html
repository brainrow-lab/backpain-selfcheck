  var state = { screen: 'intro', flags: [], answers: [], type: null };
  var TOTAL = QS.length;

  function drawSpine(curIdx) {
    if (curIdx == null) { spineBox.classList.add('hide'); return; }
    spineBox.classList.remove('hide');
    var html = '';
    for (var i = 0; i < TOTAL; i++) {
      var cls = 'vert' + (i < curIdx ? ' on' : '') + (i === curIdx ? ' on cur' : '');
      html += '<span class="' + cls + '"></span>';
    }
    spine.innerHTML = html;
    steplab.textContent = '질문 ' + (curIdx + 1) + ' / ' + TOTAL;
  }

  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function nl(s){ return esc(s).replace(/\n/g,'<br>'); }

  // ---------- screens ----------
  function render() {
    var s = state.screen;
    if (s === 'intro') return intro();
    if (s === 'flags') return flags();
    if (s === 'redflag') return redflag();
    if (typeof s === 'number') return question(s);
    if (s === 'result') return result();
    if (s === 'done') return done();
  }

        '<h2>네가 체크한 신호는 집에서 판단할 게 아니야.</h2>' +
        '<p>다리로 뻗치는 저림·힘빠짐, 대소변 변화, 밤에 깨는 통증, 외상 뒤 통증 같은 건 신경·구조 문제일 수 있어서 <b>병원·전문의가 먼저</b> 봐야 해. 여기서 운동부터 시키는 게 오히려 위험할 수 있어.</p>' +
        '<p class="meta">정형외과·신경외과 진료를 먼저 받아줘. 검사 결과 큰 문제 없다고 나오면, 그때 유형별 관리로 다시 찾아와.</p>' +
        '<div class="slogan">일상이 치료야 — 근데 순서가 있어.</div>' +
        '<div class="row"><button class="btn ghost next" id="back">← 다시 확인할게</button></div>' +
      '</div>';
    document.getElementById('back').onclick = function () { state.screen = 'flags'; render(); };
  }

  function question(idx) {
    drawSpine(idx);
    var Q = QS[idx];
    var chosen = state.answers[idx];
    var opts = Q.o.map(function (o, i) {
      var sel = chosen === i;
      return '<button class="opt' + (sel ? ' sel' : '') + '" data-i="' + i + '">' +
        '<span class="tick"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6.2l2.6 2.6L10 3" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
        '<span class="lab">' + nl(o.t) + '</span></button>';
    }).join('');
    stage.innerHTML =
      '<div class="card panel">' +
        '<div class="q-num tnum">Q' + (idx + 1) + '.</div>' +
        '<div class="q-text">' + nl(Q.q) + '</div>' +
        '<div class="opts">' + opts + '</div>' +
        '<div class="row">' +
          '<button class="btn ghost back" id="back">← 뒤로</button>' +
          '<button class="btn next" id="next"' + (chosen == null ? ' disabled' : '') + '>' + (idx === TOTAL - 1 ? '결과 보기 →' : '다음 →') + '</button>' +
        '</div>' +
      '</div>';
    stage.querySelectorAll('.opt').forEach(function (b) {
      b.onclick = function () {
        state.answers[idx] = +b.dataset.i;
        stage.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('sel'); });
        b.classList.add('sel');
        var nx = document.getElementById('next'); nx.disabled = false;
        setTimeout(advance, 230);
      };
    });
    function advance() {
      if (state.answers[idx] == null) return;
      if (idx === TOTAL - 1) { score(); state.screen = 'result'; }
      else state.screen = idx + 1;
      render();
    }
    document.getElementById('next').onclick = advance;
    document.getElementById('back').onclick = function () {
      state.screen = idx === 0 ? 'flags' : idx - 1; render();
    };
  }

  function score() {
    var tot = { A: 0, B: 0, C: 0 };
    state.answers.forEach(function (ai, qi) {
      var s = QS[qi].o[ai].s;
      for (var k in s) tot[k] += s[k];
    });
    // 최고점 — 동점이면 가장 진단적인 Q1(제일 아픈 순간)이 가리킨 유형을 우선(둔근 편중 제거).
    var q1map = ['A', 'B', 'C']; // Q1 선택지 순서 → 유형
    var q1type = q1map[state.answers[0]];
    var maxScore = Math.max(tot.A, tot.B, tot.C);
    var tied = ['A', 'B', 'C'].filter(function (k) { return tot[k] === maxScore; });
    var best = (tied.indexOf(q1type) >= 0) ? q1type : tied[0]; // 동점에 Q1유형 있으면 그걸, 없으면 A>B>C
    // 혼합형: 2위 점수가 0 초과 + 1위와 2점 이내면 '섞임'으로 표시(대부분 허리는 한 가지로 안 떨어짐)
    var second = null, secondScore = -1;
    ['A', 'B', 'C'].forEach(function (k) { if (k !== best && tot[k] > secondScore) { second = k; secondScore = tot[k]; } });
    state.type = best; state.scores = tot;
    state.mixed = (secondScore > 0 && (tot[best] - secondScore) <= 2) ? second : null;
  }

  function result() {
    drawSpine(null);
    var T = TYPES[state.type];
    stage.innerHTML =
      '<div class="card panel">' +
        '<span class="type-badge">🧭 ' + esc(T.badge) + '</span>' +
        '<h2 style="margin-top:14px">' + esc(T.title) + '</h2>' +
        '<div class="vs">' +
          '<div class="cell pain"><div class="k">아픈 곳</div><div class="v">' + esc(T.pain) + '</div></div>' +
          '<div class="arrow">→</div>' +
          '<div class="cell cause"><div class="k">숨은 원인</div><div class="v">' + esc(T.cause) + '</div></div>' +
        '</div>' +
        '<p class="why">' + T.why + '</p>' +
        (state.mixed ? '<div class="mixnote">너는 <b>주로 ' + esc(TYPES[state.type].badge) + '</b>인데 <b>' + esc(TYPES[state.mixed].badge) + ' 성향</b>도 조금 섞여 있어. 사실 허리는 딱 한 가지로 안 떨어지는 사람이 더 많아 — 오늘은 제일 큰 것부터 잡고, 섞인 부분은 <b>전체 루틴에서 같이</b> 봐줄게.</div>' : '') +
        '<div class="cue">' +
          '<div class="tag">🎁 무료 큐 · 오늘 하나만</div>' +
          '<h3>' + esc(T.cue.name) + '</h3>' +
          '<p>' + esc(T.cue.steps) + '</p>' +
          '<div class="stop">⚠️ ' + esc(T.cue.stop) + '</div>' +
        '</div>' +
        '<div class="slogan">일상이 치료야</div>' +
      '</div>' +
      gateHTML();
    bindGate();
  }

  function gateHTML() {
    var T = TYPES[state.type];
    return '<div class="card panel gate">' +
      '<div class="eyebrow">내 유형 1주차 루틴 받기</div>' +
      '<h2 style="margin-top:10px">"' + esc(T.badge) + '" 전용 1주차 루틴,<br>바로 보여줄게.</h2>' +
      '<p>오늘 큐 하나로는 부족해. 네 유형이 왜 그렇게 됐는지랑, 이번 주에 뭘 어떻게 할지 정리한 걸 <b>지금 바로</b> 볼 수 있어. 2주차부터는 순서대로 메일로 보내줄게. <b>스팸 안 보내 — 루틴이랑 몸 얘기만.</b></p>' +
      '<form id="lead" novalidate>' +
        '<input type="text" name="botcheck" id="botcheck" class="hide" tabindex="-1" autocomplete="off" aria-hidden="true" />' +
        '<div class="field">' +
          '<input id="email" name="email" type="email" inputmode="email" placeholder="이메일 주소" autocomplete="email" required />' +
          '<label class="consent"><input type="checkbox" id="agree" /><span><b>개인정보 수집·이용</b>(수집 항목: 이메일 / 목적: 루틴·건강 정보 발송 / 구독 취소 시 즉시 파기)에 동의해. 언제든 취소할 수 있고, 이건 의료 조언이 아니라 자기 관리용이라는 걸 이해했어.</span></label>' +
        '</div>' +
        '<button class="btn" id="send" type="submit" disabled>내 유형 루틴 받기 →</button>' +
        '<p class="err hide" id="err" role="alert"></p>' +
      '</form>' +
      '<p class="meta" style="margin-top:10px">이미 수천 명의 몸을 봐온 물리치료사가 정리한 거야.</p>' +
    '</div>';
  }

  // 스티비 구독 폼의 공개 엔드포인트(비밀키 아님 — 웹페이지 삽입용으로 공개 설계됨).
  // 전송 규격은 스티비 공식 폼 스크립트와 동일: x-www-form-urlencoded, 키는 input id에서 'stb_' 뗀 것.
  var STIBEE_EP = 'https://stibee.com/api/v1.0/lists/Ur2L2cjyEaXaKPG_0VXhnRikMuOaEQ==/public/subscribers';
  var STIBEE_TYPE_KEY = 'type'; // ⚠️ 스티비 [사용자 정의 필드]의 '키'와 반드시 동일해야 저장됨

  function postStibee(addr, typeCode) {
    if (!STIBEE_EP) return Promise.resolve();
    var body = 'email=' + encodeURIComponent(addr) +
               '&' + STIBEE_TYPE_KEY + '=' + encodeURIComponent(typeCode);
    // no-cors: 응답은 못 읽지만 등록은 정상 처리됨(단순요청이라 preflight 없음). 실패해도 흐름 안 막음.
    return fetch(STIBEE_EP, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body
    }).catch(function () {});
  }

  function bindGate() {
    var form = document.getElementById('lead');
    var email = document.getElementById('email');
    var agree = document.getElementById('agree');
    var send = document.getElementById('send');
    var err = document.getElementById('err');
    function check() { send.disabled = !(/\S+@\S+\.\S+/.test(email.value) && agree.checked); }
    email.addEventListener('input', check);
    agree.addEventListener('change', check);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (send.disabled) return;
      if (document.getElementById('botcheck').value) return; // 허니팟(봇 차단)
      state.email = email.value.trim();
      err.classList.add('hide');
      // 스티비 주소록에 등록(주 저장소). 응답 대기 없이 먼저 쏘고 흐름은 계속.
      postStibee(state.email, state.type);
      // 데모 모드(키 없음/샌드박스): 실제 전송 없이 완료 화면
      if (!W3F_KEY) { state.screen = 'done'; render(); scrollTop(); return; }
      send.disabled = true; send.textContent = '보내는 중…';
      fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          access_key: W3F_KEY,
          subject: '[허리 자가진단] ' + TYPES[state.type].badge + ' — 루틴 신청',
          from_name: LIST_NAME,
          email: state.email,
          '유형': TYPES[state.type].badge,
          '유형코드': state.type,
          '출처': 'honest.pt 허리 자가진단툴'
        })
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (d && d.success) { state.screen = 'done'; render(); scrollTop(); }
        else { throw new Error((d && d.message) || 'fail'); }
      }).catch(function () {
        send.disabled = false; send.textContent = '내 유형 루틴 받기 →';
        err.textContent = '잠깐, 전송이 안 됐어. 네트워크 확인하고 한 번만 더 눌러줄래?';
        err.classList.remove('hide');
      });
    });
  }

  function renderRoutine(type) {
    var R = ROUTINES[type], T = TYPES[type];
    var moves = R.moves.map(function (m, i) {
      return '<div class="move">' +
        '<div class="mh"><span class="mn">' + (i + 1) + '. ' + esc(m.name) + '</span><span class="mtag">' + esc(m.tag) + '</span></div>' +
        '<p class="ms">' + esc(m.steps) + '</p>' +
        (m.dose ? '<span class="md">' + esc(m.dose) + '</span>' : '') +
        (m.rule ? '<div class="mrule"><b>⚠️ 저림 규칙:</b> ' + esc(m.rule) + '</div>' : '') +
      '</div>';
    }).join('');
    return '<div class="card panel">' +
      '<div class="routehead"><span class="wk">1주차 루틴</span><span class="type-badge">' + esc(T.badge) + '</span></div>' +
      '<div class="wk-goal"><div class="k">이번 주 목표</div><div class="v">' + esc(R.goal) + '</div></div>' +
      '<p class="wk-why">' + esc(R.why) + '</p>' +
      '<div class="sect">오늘부터 · 하루 5분</div>' + moves +
      '<div class="sect">이번 주 셀프체크 (2주차 가도 되나)</div>' +
      '<div class="checkrow">' +
        '<div class="ci good"><span class="ic">✓</span><span>' + esc(R.good) + '</span></div>' +
        '<div class="ci bad"><span class="ic">✕</span><span>' + esc(R.bad) + '</span></div>' +
      '</div>' +
      '<div class="safebox"><b>⚠️ 꼭 지킬 것:</b> ' + esc(COMMON_SAFETY) + '</div>' +
      '<div class="nextwk"><b>2주차 예고:</b> ' + esc(R.next) + '</div>' +
      '<div class="slogan">일상이 치료야</div>' +
    '</div>';
  }

  function done() {
    drawSpine(null);
    var T = TYPES[state.type];
    stage.innerHTML =
      '<div class="card panel">' +
        '<div class="eyebrow">✓ 신청 완료</div>' +
        '<h2 style="margin-top:12px">바로 아래가 네 1주차야.</h2>' +
        '<p>스크린샷 하거나 저장해두고, 오늘부터 딱 5분씩 며칠 해봐. 아래 셀프체크로 확인하고. <b>2주차부터는 ' + esc(state.email || '') + '로 보내줄게.</b></p>' +
      '</div>' +
      renderRoutine(state.type) +
      '<div class="card panel">' +
        '<div class="paidbridge" style="border:none;padding:0">' +
          '<div class="k">더 깊게 가고 싶으면</div>' +
          '<h3>"' + esc(T.badge) + '" 4주 교정 프로그램</h3>' +
          '<p>1주차는 시작일 뿐이야. 2~4주(방향 잡기 → 통합 → 강화)까지 영상 가이드 + 안 풀릴 때 1:1 질문까지. 지금 준비 중 — 관심 등록해두면 열릴 때 먼저, 얼리버드로 알려줄게.</p>' +
          '<button class="btn ghost" id="waitlist">먼저 알림 받기</button>' +
        '</div>' +
        '<div class="row"><button class="btn ghost next" id="again">← 처음부터 다시</button></div>' +
      '</div>';
    document.getElementById('waitlist').onclick = function (e) {
      e.target.textContent = '✓ 등록됐어 — 먼저 알려줄게'; e.target.disabled = true;
    };
    document.getElementById('again').onclick = function () {
      state = { screen: 'intro', flags: [], answers: [], type: null }; render(); scrollTop();
    };
  }

  render();
})();
</script>
