      cue: {
        name: "복부 브레이싱 — 허리 대신 배가 버티게",
        steps: "바로 누워 무릎 세우고, 숨을 내쉬면서 배를 '살짝 단단하게' 만들어(힘껏 조이는 게 아니라 기침 직전 느낌). 갈비뼈는 바닥 쪽으로 살짝 내려. 허리와 바닥 사이 뜬 공간이 줄어드는 게 느껴지면 맞아.",
        stop: "숨을 참거나 허리가 더 꺾이면 힘을 빼. 10초씩 5번, 천천히."
      }
    },
    C: {
      badge: "불안정·둔근형",
      title: "자세 바꿀 때 찌릿한 허리 — '허리는 죄가 없다'",
      pain: "한쪽 허리",
      cause: "일 안 하는 엉덩이 근육",
      why: "자세 바꾸는 순간 찌릿하고 한쪽만 아픈 건, <b>엉덩이 근육(중둔근)이 제때 안 켜져서 허리가 그 일을 대신 떠맡고 있어서</b>야. 짝다리·한쪽 골반 처짐도 같은 신호. 그래서 아픈 허리만 풀면 잠깐 편했다가 또 도져 — 정작 쉬고 있는 건 엉덩이거든.",
      cue: {
        name: "조개 운동 — 잠든 중둔근 깨우기",
        steps: "옆으로 누워 무릎을 90도 굽히고 발뒤꿈치는 붙인 채, 위쪽 무릎만 천장으로 천천히 열어(조개가 열리듯). 골반이 뒤로 같이 넘어가지 않게 고정하고, 엉덩이 바깥·중간에 힘이 들어오는 걸 느껴.",
        stop: "허리에 힘이 들어오거나 골반이 돌아가면 범위를 줄여. 양쪽 12번씩, 느낌 확인이 먼저야."
      }
    }
  };

  // ---------- state ----------
  var state = { screen: 'intro', flags: [], answers: [], type: null };
  var TOTAL = QS.length;

  function drawSpine(curIdx) {
    if (curIdx == null) { spineBox.classList.add('hide'); return; }
    spineBox.classList.remove('hide');
    var html = '';
    for (var i = 0; i < TOTAL; i++) {
      var cls = 'vert' + (i < curIdx ? ' on' : '') + (i === curIdx ? ' on cur' : '');
      html += '<span class="' + cls + '"></span>';
    }
    spine.innerHTML = html;
    steplab.textContent = '질문 ' + (curIdx + 1) + ' / ' + TOTAL;
  }

  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function nl(s){ return esc(s).replace(/\n/g,'<br>'); }

  // ---------- screens ----------
  function render() {
    var s = state.screen;
    if (s === 'intro') return intro();
    if (s === 'flags') return flags();
    if (s === 'redflag') return redflag();
    if (typeof s === 'number') return question(s);
    if (s === 'result') return result();
    if (s === 'done') return done();
  }

  function intro() {
    drawSpine(null);
    stage.innerHTML =
      '<div class="card panel">' +
        '<div class="eyebrow">1분 허리 자가진단</div>' +
        '<h1>네 허리, 진짜 문제는<br>허리가 아닐 수 있어.</h1>' +
        '<p class="lead">같은 허리 통증도 <b>왜 아픈지</b>가 사람마다 달라. 아픈 곳만 풀면 그때뿐인 이유가 거기 있어.</p>' +
        '<div class="quotes">' +
          '<div class="quote">"골반교정에 <b>수천만 원</b> 썼는데 결국 발·엉덩이 문제였다"</div>' +
          '<div class="quote">"병원 다닌 돈만 수백만 원인데 <b>원인을 아직도 모르겠어요</b>"</div>' +
        '</div>' +
        '<p class="meta">6개 질문이면 네가 어떤 유형인지, 진짜 원인이 어디인지 짚어줄게. 진단이 아니라 <b>관찰</b>이야.</p>' +
        '<div class="row"><button class="btn next" id="go">시작하기 →</button></div>' +
      '</div>';
    document.getElementById('go').onclick = function () { state.screen = 'flags'; render(); };
  }

  function flags() {
    drawSpine(null);
    var items = RED_FLAGS.map(function (t, i) {
      var sel = state.flags.indexOf(i) >= 0;
      return '<button class="opt check' + (sel ? ' sel' : '') + '" data-i="' + i + '">' +
        '<span class="tick"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6.2l2.6 2.6L10 3" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
        '<span class="lab">' + esc(t) + '</span></button>';
    }).join('');
    stage.innerHTML =
      '<div class="card panel">' +
        '<div class="eyebrow">먼저, 안전 확인</div>' +
        '<div class="q-text" style="margin-top:10px">아래 중에 <u>지금 겪고 있는 것</u>이 있어?<br>해당되는 걸 다 눌러줘.</div>' +
        '<div class="opts">' + items +
          '<button class="opt' + (state.flags.length === 0 && state._flagsSeen ? ' sel' : '') + '" id="none">' +
          '<span class="tick"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6.2l2.6 2.6L10 3" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
          '<span class="lab">해당되는 게 하나도 없어</span></button>' +
        '</div>' +
        '<div class="row"><button class="btn ghost back" id="back">← 뒤로</button><button class="btn next" id="next">다음 →</button></div>' +
      '</div>';
    stage.querySelectorAll('.opt.check').forEach(function (b) {
      b.onclick = function () {
        var i = +b.dataset.i, p = state.flags.indexOf(i);
        if (p >= 0) state.flags.splice(p, 1); else state.flags.push(i);
        b.classList.toggle('sel');
        document.getElementById('none').classList.remove('sel');
      };
    });
    document.getElementById('none').onclick = function () { state.flags = []; state._flagsSeen = true; nextFromFlags(); };
    document.getElementById('back').onclick = function () { state.screen = 'intro'; render(); };
    document.getElementById('next').onclick = nextFromFlags;
  }
  function nextFromFlags() {
    if (state.flags.length > 0) { state.screen = 'redflag'; render(); }
    else { state.answers = []; state.screen = 0; render(); }
  }

  function redflag() {
    drawSpine(null);
    stage.innerHTML =
      '<div class="card panel flag">' +
        '<div class="eyebrow">잠깐 — 이건 자가진단 대상이 아니야</div>' +
        '<h2>네가 체크한 신호는 집에서 판단할 게 아니야.</h2>' +
        '<p>다리로 뻗치는 저림·힘빠짐, 대소변 변화, 밤에 깨는 통증, 외상 뒤 통증 같은 건 신경·구조 문제일 수 있어서 <b>병원·전문의가 먼저</b> 봐야 해. 여기서 운동부터 시키는 게 오히려 위험할 수 있어.</p>' +
        '<p class="meta">정형외과·신경외과 진료를 먼저 받아줘. 검사 결과 큰 문제 없다고 나오면, 그때 유형별 관리로 다시 찾아와.</p>' +
        '<div class="slogan">일상이 치료야 — 근데 순서가 있어.</div>' +
        '<div class="row"><button class="btn ghost next" id="back">← 다시 확인할게</button></div>' +
      '</div>';
    document.getElementById('back').onclick = function () { state.screen = 'flags'; render(); };
  }

  function question(idx) {
    drawSpine(idx);
    var Q = QS[idx];
    var chosen = state.answers[idx];
    var opts = Q.o.map(function (o, i) {
      var sel = chosen === i;
      return '<button class="opt' + (sel ? ' sel' : '') + '" data-i="' + i + '">' +
        '<span class="tick"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6.2l2.6 2.6L10 3" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
        '<span class="lab">' + nl(o.t) + '</span></button>';
    }).join('');
    stage.innerHTML =
      '<div class="card panel">' +
        '<div class="q-num tnum">Q' + (idx + 1) + '.</div>' +
        '<div class="q-text">' + nl(Q.q) + '</div>' +
        '<div class="opts">' + opts + '</div>' +
        '<div class="row">' +
          '<button class="btn ghost back" id="back">← 뒤로</button>' +
          '<button class="btn next" id="next"' + (chosen == null ? ' disabled' : '') + '>' + (idx === TOTAL - 1 ? '결과 보기 →' : '다음 →') + '</button>' +
        '</div>' +
      '</div>';
    stage.querySelectorAll('.opt').forEach(function (b) {
      b.onclick = function () {
        state.answers[idx] = +b.dataset.i;
        stage.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('sel'); });
        b.classList.add('sel');
        var nx = document.getElementById('next'); nx.disabled = false;
        setTimeout(advance, 230);
      };
    });
    function advance() {
      if (state.answers[idx] == null) return;
      if (idx === TOTAL - 1) { score(); state.screen = 'result'; }
      else state.screen = idx + 1;
      render();
    }
    document.getElementById('next').onclick = advance;
    document.getElementById('back').onclick = function () {
      state.screen = idx === 0 ? 'flags' : idx - 1; render();
    };
  }

  function score() {
    var tot = { A: 0, B: 0, C: 0 };
    state.answers.forEach(function (ai, qi) {
      var s = QS[qi].o[ai].s;
      for (var k in s) tot[k] += s[k];
    });
    var order = ['C', 'A', 'B']; // tie-break priority: 둔근형 우선(가장 흔한 놓침), 그다음 굴곡
    var best = order[0];
    order.forEach(function (k) { if (tot[k] > tot[best]) best = k; });
    state.type = best; state.scores = tot;
  }

  function result() {
    drawSpine(null);
    var T = TYPES[state.type];
    stage.innerHTML =
      '<div class="card panel">' +
        '<span class="type-badge">🧭 ' + esc(T.badge) + '</span>' +
        '<h2 style="margin-top:14px">' + esc(T.title) + '</h2>' +
        '<div class="vs">' +
          '<div class="cell pain"><div class="k">아픈 곳</div><div class="v">' + esc(T.pain) + '</div></div>' +
          '<div class="arrow">→</div>' +
          '<div class="cell cause"><div class="k">진짜 원인</div><div class="v">' + esc(T.cause) + '</div></div>' +
        '</div>' +
        '<p class="why">' + T.why + '</p>' +
        '<div class="cue">' +
          '<div class="tag">🎁 무료 큐 · 오늘 하나만</div>' +
          '<h3>' + esc(T.cue.name) + '</h3>' +
          '<p>' + esc(T.cue.steps) + '</p>' +
          '<div class="stop">⚠️ ' + esc(T.cue.stop) + '</div>' +
        '</div>' +
        '<div class="slogan">일상이 치료야</div>' +
      '</div>' +
      gateHTML();
    bindGate();
  }

  function gateHTML() {
    var T = TYPES[state.type];
    return '<div class="card panel gate">' +
      '<div class="eyebrow">전체 맞춤 루틴 받기</div>' +
      '<h2 style="margin-top:10px">"' + esc(T.badge) + '" 전용 4주 루틴,<br>이메일로 보내줄게.</h2>' +
      '<p>오늘 큐 하나로는 부족해. 네 유형이 왜 그렇게 됐는지 전체 기전 + 주차별로 뭘 언제 해야 하는지 정리한 걸 보내줄게. <b>스팸 안 보내 — 루틴이랑 몸 얘기만.</b></p>' +
      '<form id="lead" novalidate>' +
        '<input type="text" name="botcheck" id="botcheck" class="hide" tabindex="-1" autocomplete="off" aria-hidden="true" />' +
        '<div class="field">' +
          '<input id="email" name="email" type="email" inputmode="email" placeholder="이메일 주소" autocomplete="email" required />' +
          '<label class="consent"><input type="checkbox" id="agree" /><span>루틴·건강 정보 메일 수신에 동의해. 언제든 구독 취소 가능하고, 이건 의료 조언이 아니라 자기 관리용이라는 걸 이해했어.</span></label>' +
        '</div>' +
        '<button class="btn" id="send" type="submit" disabled>내 유형 루틴 받기 →</button>' +
        '<p class="err hide" id="err" role="alert"></p>' +
      '</form>' +
      '<p class="meta" style="margin-top:10px">이미 수천 명의 몸을 봐온 물리치료사가 정리한 거야.</p>' +
    '</div>';
  }

  function bindGate() {
    var form = document.getElementById('lead');
    var email = document.getElementById('email');
    var agree = document.getElementById('agree');
    var send = document.getElementById('send');
    var err = document.getElementById('err');
    function check() { send.disabled = !(/\S+@\S+\.\S+/.test(email.value) && agree.checked); }
    email.addEventListener('input', check);
    agree.addEventListener('change', check);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (send.disabled) return;
      if (document.getElementById('botcheck').value) return; // 허니팟(봇 차단)
      state.email = email.value.trim();
      err.classList.add('hide');
      // 데모 모드(키 없음/샌드박스): 실제 전송 없이 완료 화면
      if (!W3F_KEY) { state.screen = 'done'; render(); scrollTop(); return; }
      send.disabled = true; send.textContent = '보내는 중…';
      fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          access_key: W3F_KEY,
          subject: '[허리 자가진단] ' + TYPES[state.type].badge + ' — 루틴 신청',
          from_name: LIST_NAME,
          email: state.email,
          '유형': TYPES[state.type].badge,
          '유형코드': state.type,
          '출처': 'honest.pt 허리 자가진단툴'
        })
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (d && d.success) { state.screen = 'done'; render(); scrollTop(); }
        else { throw new Error((d && d.message) || 'fail'); }
      }).catch(function () {
        send.disabled = false; send.textContent = '내 유형 루틴 받기 →';
        err.textContent = '잠깐, 전송이 안 됐어. 네트워크 확인하고 한 번만 더 눌러줄래?';
        err.classList.remove('hide');
      });
    });
  }

  function done() {
    drawSpine(null);
    var T = TYPES[state.type];
    stage.innerHTML =
      '<div class="card panel">' +
        '<div class="eyebrow">✓ 보냈어</div>' +
        '<h2 style="margin-top:12px">메일함 확인해봐.<br>안 오면 스팸함도 한 번.</h2>' +
        '<p>"' + esc(T.badge) + '" 4주 루틴을 <b>' + esc(state.email || '') + '</b>로 보냈어. 오늘 배운 큐부터 며칠 해보고, 메일 루틴이랑 같이 가면 돼.</p>' +
        '<div class="paidbridge">' +
          '<div class="k">더 깊게 가고 싶으면</div>' +
          '<h3>"' + esc(T.badge) + '" 4주 교정 프로그램</h3>' +
          '<p>영상 동작 가이드 + 주차별 체크 + 안 풀릴 때 1:1 질문까지. 지금 준비 중이야 — 관심 등록해두면 열릴 때 먼저, 얼리버드로 알려줄게.</p>' +
          '<button class="btn ghost" id="waitlist">먼저 알림 받기</button>' +
        '</div>' +
        '<div class="slogan" style="margin-top:20px">일상이 치료야</div>' +
        '<div class="row"><button class="btn ghost next" id="again">← 처음부터 다시</button></div>' +
      '</div>';
    document.getElementById('waitlist').onclick = function (e) {
      e.target.textContent = '✓ 등록됐어 — 먼저 알려줄게'; e.target.disabled = true;
    };
    document.getElementById('again').onclick = function () {
      state = { screen: 'intro', flags: [], answers: [], type: null }; render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
  }

  render();
})();
</script>
